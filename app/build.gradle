plugins { id 'com.android.application' }
android {
  namespace 'com.ahmed.gympro'
  compileSdk 35
  defaultConfig { applicationId "com.ahmed.gympro"; minSdk 23; targetSdk 35; versionCode 15; versionName "1.8.3" }
  signingConfigs {
    stableDebug {
      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }
  buildTypes {
    debug { signingConfig signingConfigs.stableDebug }
    release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}