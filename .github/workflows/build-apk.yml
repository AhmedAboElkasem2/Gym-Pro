name: Build VantaLift APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 4 * * 0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Gym Pro signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gym-pro-stable-signing-v1

      - name: Verify stable signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          echo "Stable Gym Pro signing key cache is missing. Refusing to rotate the app signing key."
          exit 1

      - name: Bundle ES modules
        run: npx --yes esbuild@0.25.10 app/src/main/web-src/main.mjs --bundle --format=iife --target=chrome100 --outfile=app/src/main/assets/app.bundle.js

      - name: Unit tests
        run: node --test scripts/unit/*.test.mjs

      - name: Architecture guard
        run: node scripts/architecture-test.js

      - name: Runtime smoke test
        run: node scripts/smoke-test.js

      - name: Create recovered backup
        run: node scripts/recover-known-backup.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android unit tests, lint and APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-and-lint-reports
          path: app/build/reports/

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VantaLift-v3.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VantaLift-APK-candidate
          path: dist/VantaLift-v3.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Recovered-Gym-Pro-Backup
          path: dist/Recovered-Gym-Pro-Backup.json

  android-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/cache/restore@v4
        id: signing-key
        with:
          path: ~/.android/debug.keystore
          key: gym-pro-stable-signing-v1
      - name: Verify stable signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: exit 1
      - name: Prepare emulator host
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash scripts/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Device-tests-API-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-diagnostics/

  verified-apk:
    needs: [build, android-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VantaLift-APK-candidate
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: VantaLift-APK
          path: dist/*.apk
