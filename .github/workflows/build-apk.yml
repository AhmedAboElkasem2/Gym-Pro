name: Build Gym Pro APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "17 4 * * 0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Gym Pro signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gym-pro-stable-signing-v1

      - name: Create stable signing key on first run
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Gym Pro Stable,O=AhmedAboElkasem2,C=EG" \
            -keyalg RSA -keysize 2048 -validity 10000

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gym-Pro-v1.5.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gym-Pro-APK
          path: dist/Gym-Pro-v1.5.0.apk
